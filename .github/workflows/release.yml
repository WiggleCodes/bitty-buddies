# Builds the Windows installer and publishes them to a GitHub Release.
#
# Actions tab → Release → Run workflow:
#   - if package.json's version has no release yet, it tags it and publishes a new release
#   - if it already has one, it rebuilds that version in place and replaces its downloads
# Pushing a v* tag yourself also publishes, and so does pushing a new "version" in
# package.json to main (it's skipped if that version is already released).
name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      inplace: ${{ steps.tag.outputs.inplace }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Create or move the version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "inplace=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; nothing to do"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag -f "$TAG" && git push -f origin "refs/tags/$TAG"
            if [ -f "release-notes/$TAG.md" ]; then gh release edit "$TAG" --notes-file "release-notes/$TAG.md" || true; fi
            echo "inplace=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding $TAG in place at $(git rev-parse --short HEAD)"
          else
            git tag "$TAG" && git push origin "$TAG"
            # Create the release once here; the Windows build adds its files to it.
            if [ -f "release-notes/$TAG.md" ]; then NOTES=(--notes-file "release-notes/$TAG.md"); else NOTES=(--notes "Bitty Buddies $TAG"); fi
            gh release create "$TAG" --title "Bitty Buddies $TAG" "${NOTES[@]}" --verify-tag
            echo "inplace=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.skip != 'true'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and publish a new release
        if: needs.tag.outputs.inplace != 'true'
        run: npx electron-builder --publish always

      # A copy with a fixed name, so the website can link straight to the newest installer.
      - name: Add a stable-named installer
        shell: bash
        run: |
          cp dist/Bitty-Buddies-Setup-*.exe dist/Bitty-Buddies-Setup.exe
          gh release upload "${{ needs.tag.outputs.tag }}" dist/Bitty-Buddies-Setup.exe --clobber --repo "$GITHUB_REPOSITORY"

      - name: Build and replace the existing release's downloads
        if: needs.tag.outputs.inplace == 'true'
        shell: bash
        run: |
          npx electron-builder --publish never
          shopt -s nullglob
          files=(dist/*.exe dist/*.blockmap dist/latest*.yml)
          ls -l "${files[@]}"
          gh release upload "${{ needs.tag.outputs.tag }}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # Posts new versions to the Discord #updates channel (skipped for in-place rebuilds).
  # Needs a repo secret called DISCORD_UPDATES_WEBHOOK holding the channel's webhook URL.
  announce:
    needs: [tag, build]
    if: needs.tag.outputs.skip != 'true' && needs.tag.outputs.inplace != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_UPDATES_WEBHOOK secret; skipping"; exit 0; fi
          URL="https://wigglecodes.github.io/bitty-buddies/"
          NOTES="Your app will update itself next time it checks. New here? Grab it from the link above."
          if [ -f "release-notes/$TAG.md" ]; then NOTES="$(tail -n +2 "release-notes/$TAG.md" | head -c 3800)"; fi
          jq -n --arg tag "$TAG" --arg url "$URL" --arg notes "$NOTES" '{
            username: "Bitty Buddies",
            avatar_url: "https://wigglecodes.github.io/bitty-buddies/icon.png",
            embeds: [{
              title: ("🆕 Bitty Buddies " + $tag + " is out!"),
              url: $url,
              description: $notes,
              color: 7126606
            }]
          }' > payload.json
          curl -fsS -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
