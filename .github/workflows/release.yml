# Builds Windows + macOS installers and publishes them to a GitHub Release.
# Installed apps auto-update from these releases.
#
# To release: bump "version" in package.json, push to main, then either
#   - Actions tab → Release → Run workflow (the tag v<version> is created for you), or
#   - push a tag yourself: git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Create the version tag if needed
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG" && git push origin "$TAG"
          fi

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple certificate yet: build unsigned. Add CSC_LINK / CSC_KEY_PASSWORD /
          # APPLE_ID secrets later and remove this line to sign + notarise.
          CSC_IDENTITY_AUTO_DISCOVERY: false
