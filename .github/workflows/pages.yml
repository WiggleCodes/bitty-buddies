# Publishes the website in site/ to GitHub Pages, using the app's real sprites.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'src/packs/**', 'src/shared/**', '.github/banner.png', 'build/icon.png', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'   # refresh the saved Discord member count

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/js/packs
          cp -r site/. _site/
          cp src/shared/pixel.js _site/js/
          cp src/packs/*.js _site/js/packs/
          rm _site/js/packs/index.js
          # bust browser caches: every deploy gets fresh script and style URLs
          V=$(date +%s); sed -i -E "s#\?v=[0-9]+#?v=$V#g" _site/*.html
          cp .github/banner.png _site/banner.png
          cp build/icon.png _site/icon.png
          curl -fsS 'https://discord.com/api/v10/invites/aCHyjABJG7?with_counts=true' \
            | jq '{approximate_member_count, approximate_presence_count}' > _site/discord.json || echo '{}' > _site/discord.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
