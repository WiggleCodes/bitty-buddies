<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Bitty Buddies licence</title>
  <style>
    :root { --sky: #8FCBF0; --grass: #6CBE4E; --dirt: #7C573A; --ink: #2E345C; --card: #FFFDF6; --red: #C8392F; --ok: #3C8A2D; }
    * { box-sizing: border-box; }
    body { margin: 0; min- font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ink);
      background: linear-gradient(var(--sky) 0 82%, var(--grass) 82% 86%, var(--dirt) 86%); 
      display: flex; align-items: center; justify-content: center; user-select: none; }
    .card { width: 360px; background: var(--card); border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 20px; }
    h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: 1px; }
    p { margin: 0 0 14px; }
    input { width: 100%; font: inherit; font-size: 15px; letter-spacing: 1px; padding: 10px; border: 3px solid var(--ink);
      text-transform: uppercase; background: #fff; outline: none; user-select: text; }
    input:focus { border-color: #3C74E0; }
    .row { display: flex; gap: 10px; margin-top: 12px; }
    button { flex: 1; font: inherit; font-weight: bold; padding: 10px; border: 3px solid var(--ink); background: var(--grass);
      color: #fff; text-shadow: 2px 2px 0 var(--ink); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
    button.alt { background: #B8C0CC; }
    button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { min-height: 20px; margin-top: 12px; font-size: 13px; }
    .err { color: var(--red); } .good { color: var(--ok); }
    .hidden { display: none; }
    .list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
    .list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 3px solid var(--ink); background: #fff; padding: 6px 8px; }
    .list button { flex: none; font-size: 12px; padding: 4px 8px; box-shadow: 2px 2px 0 var(--ink); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 Licence keys</h1>
    <p>One key holds every pack you buy. Got an upgraded key? Paste it here and it replaces your old one.</p>
    <input id="key" placeholder="Paste your BITTY-… key" spellcheck="false" autocomplete="off" autofocus>
    <div class="row">
      <button id="activate">Unlock</button>
      <button id="close" class="alt">Close</button>
    </div>
    <div id="msg" class="msg"></div>
    <ul id="list" class="list"></ul>
  </div>
  <script src="licence.js"></script>
</body>
</html>
